apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newcicd-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Ritesh-xx/newcicd-gitops.git
    targetRevision: main
    path: dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true